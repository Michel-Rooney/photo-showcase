<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small collection of travel and nature photos with captions and an embedded video."
    />
    <title>Photo Showcase</title>

    <link rel="stylesheet" href="./src/css/style.css" />
  </head>
  <body>
    <header>
      <h1>Photo Showcase</h1>
      <p>A collection of moments from the coast, the forest, and beyond.</p>
    </header>

    <main>
      <h2>Photo collection</h2>
      <figure>
        <img
          src="./src/img/ivan-diaz-8e8t4hCUKpM-unsplash.jpg"
          alt="Rocky coastline and clear green water seen from above"
          width="3848"
          height="5652"
        />
        <figcaption>A quiet stretch of coastline</figcaption>
      </figure>

      <figure>
        <img
          src="./src/img/queensland-australia-M8NGoZuq22A-unsplash.jpg"
          alt="Orange koi swimming beneath ripples in dark water"
          width="4608"
          height="8192"
        />
        <figcaption>A koi gliding through the water</figcaption>
      </figure>

      <figure>
        <img
          src="./src/img/red-zeppelin-VidmBuia-6E-unsplash.jpg"
          alt="Ornate arched entrance on a pale pink building"
          width="4088"
          height="3064"
        />
        <figcaption>Details of a historic doorway</figcaption>
      </figure>

      <figure>
        <img
          src="./src/img/yusuf-onuk-0x1wfyHBgYg-unsplash.jpg"
          alt="White motorboat crossing blue water near a mountainous coast"
          width="6192"
          height="4128"
        />
        <figcaption>A boat crossing the bay</figcaption>
      </figure>

      <figure>
        <img
          src="./src/img/yusuf-onuk-_JNRNFTyGdU-unsplash.jpg"
          alt="Dense green forest surrounding a raised walking path"
          width="6192"
          height="4128"
        />
        <figcaption>A path through the rainforest</figcaption>
      </figure>

      <img
        src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&amp;fit=crop&amp;w=1200&amp;h=800&amp;q=80"
        alt=""
        width="1200"
        height="800"
      />

      <section aria-labelledby="video-heading">
        <h2 id="video-heading">A moving moment</h2>
        <video
          src="./src/media/videoplayback.mp4"
          controls
          poster="./src/img/yusuf-onuk-0x1wfyHBgYg-unsplash.jpg"
          width="6192"
          height="4128"
        >
          Your browser does not support the video element.
        </video>
      </section>
    </main>

    <footer>
      <p>Photo Showcase — a semantic HTML media project.</p>
    </footer>
  </body>
</html>
